# Paths that may be scanned but are protected for cleanup by default
immutable_roots:
  - "%WINDIR%\\System32"
  - "%WINDIR%\\SysWOW64"
  - "%WINDIR%\\WinSxS"
  - "%WINDIR%\\servicing"
  - "%WINDIR%\\Installer"
  - "%ProgramFiles%"
  - "%ProgramFiles(x86)%"
  - "%LOCALAPPDATA%\\Programs\\Microsoft VS Code\\resources\\app"
  - "%LOCALAPPDATA%\\Programs\\Microsoft VS Code\\resources\\app\\extensions"

approved_cleanup_roots:
  - "%LOCALAPPDATA%\\Temp"
  - "%WINDIR%\\Temp"
  - "%LOCALAPPDATA%\\Microsoft\\Windows\\Explorer"
  - "%LOCALAPPDATA%\\Microsoft\\Windows\\INetCache"
  - "%LOCALAPPDATA%\\CrashDumps"
  - "%LOCALAPPDATA%\\Microsoft\\Windows\\WER\\ReportQueue"
