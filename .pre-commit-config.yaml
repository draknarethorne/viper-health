minimum_pre_commit_version: "4.6.1"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ".*\\.md$"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--config, python/pyproject.toml]
        files: ^python/.*\.py$

  - repo: local
    hooks:
      - id: powershell-analysis
        name: PowerShell analysis
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/Invoke-QualityChecks.ps1
        language: system
        files: \.(ps1|psm1|psd1)$
        pass_filenames: false

      - id: full-tests
        name: Full test suite
        entry: .venv/Scripts/python.exe -m pytest -q python/tests
        language: system
        pass_filenames: false
        stages: [pre-push]
