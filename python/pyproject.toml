[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viper-health"
version = "0.1.0"
description = "SSD and filesystem health diagnostics toolkit"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Viper Health" }]
dependencies = [
    "pyyaml>=6.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/draknarethorne/viper-health"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
