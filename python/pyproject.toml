[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viper-health"
version = "0.1.0"
description = "SSD and filesystem health diagnostics toolkit"
readme = "../README.md"
requires-python = ">=3.12"
authors = [{ name = "Viper Health" }]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
